<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador V-30 / V-31 / V-15</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc3e0; font-family: system-ui, sans-serif; }
    #hud { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 1.4; }
    #minimap { position: fixed; top: 10px; width: 280px; height: 280px; border: 2px solid #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="status">Cargando…</div>
    <div id="speed"></div>
    <div id="help"></div>
  </div>
  <canvas id="minimap"></canvas>

  <script type="module">
    import * as THREE from "three";

    // ---------- Configuración ----------
    // ?data=sample        tramo sintético de prueba (sin terreno)
    // ?vmax=230           velocidad máxima en km/h (por defecto 230)
    // ?minimap=left       minimapa a la izquierda (por defecto a la derecha)
    const params = new URLSearchParams(location.search);
    const DATA_DIR = "../data/";
    const SAMPLE = params.get("data") === "sample";
    const DATA_FILE = SAMPLE ? DATA_DIR + "sample.json" : DATA_DIR + "roads.json";
    const MDT_INDEX = DATA_DIR + "mdt/index.json";
    const ORTHO_FILE = DATA_DIR + "ortho.jpg";
    const VMAX_KMH = Number(params.get("vmax")) || 230;
    const MAX_SPEED = VMAX_KMH / 3.6;          // m/s
    const MM_SIDE = params.get("minimap") === "left" ? "left" : "right";
    const FOG_ON = params.get("fog") !== "0";   // ?fog=0 desactiva la niebla (diagnóstico)
    const USE_MDT = params.get("mdt") !== "0";  // ?mdt=0 usa suelo plano (diagnóstico y pruebas rápidas)

    const LANE_W = 3.5;       // ancho de carril (m)
    const LINE_W = 0.15;      // grosor de las marcas (m)
    const DASH = 3, GAP = 6;  // discontinua: 3 m pintado, 6 m vacío

    // Parámetros de altura
    const ROAD_LIFT = 0.3;          // la calzada queda justo encima del terreno
    const BRIDGE_CLEARANCE_M = 6;   // altura del tablero sobre las orillas por nivel de "layer" (5 m mínimo para camiones + 1 m)
    const MAX_GRADE = 0.04;         // pendiente máxima de las rampas de acceso a puentes (4 %)
    const WATER_W = 25;             // TODO: usar la etiqueta width de OSM cuando exista
    const WATER_LIFT = 0.15;        // el agua se apoya sobre el terreno (sin cauce tallado)
    const SNAP_M = 15;              // radio de búsqueda para la altura del coche sobre la calzada
    const SKIRT_M = 15;             // profundidad de los faldones que tapan grietas entre niveles
    const CATMULL_SAMPLES = 2;      // muestras por tramo de 10 m tras Catmull-Rom

    const statusEl = document.getElementById("status");
    const speedEl = document.getElementById("speed");
    document.getElementById("help").textContent =
      "W/S acelerar-frenar · A/D dirección · M mapa · N norte/rumbo · +/− zoom mapa";

    // ---------- Escena ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fc3e0);
    if (FOG_ON) scene.fog = new THREE.Fog(0x9fc3e0, 600, 3000);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 5000);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(200, 400, 100);
    scene.add(sun);

    // ---------- Proyección: local (equirectangular) <-> UTM 30N ----------
    // Transformación afín ajustada en el origen. Es exacta en el origen y se aleja
    // unos metros en los bordes del área; el error se muestra en la barra de estado.
    let PROJ = null;

    // Lat/lon WGS84 -> UTM 30N (EPSG:25830), fórmulas de Krüger. Igual que scripts/utm30n.py
    function latlonToUtm30(lat, lon) {
      const a = 6378137, f = 1 / 298.257223563;
      const e2 = f * (2 - f), ep2 = e2 / (1 - e2), k0 = 0.9996;
      const lon0 = -3 * Math.PI / 180;
      const phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
      const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2);
      const T = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2;
      const A = Math.cos(phi) * (lam - lon0);
      const M = a * (
        (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi
        - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
        + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi)
        - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi)
      );
      const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6
        + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
      const y = k0 * (M + N * Math.tan(phi) * (A * A / 2
        + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24
        + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
      return [x, y];
    }

    // Ajusta la afín a partir del origen de roads.json. Devuelve el error en metros
    // en las esquinas de un área de ±17 km.
    function setupProjection(origin) {
      const LAT0 = origin.lat, LON0 = origin.lon;
      const M_LAT = 111320, M_LON = 111320 * Math.cos(LAT0 * Math.PI / 180);
      const exact = (x, z) => latlonToUtm30(LAT0 - z / M_LAT, LON0 + x / M_LON);
      const O = exact(0, 0), Ex = exact(10000, 0), Ez = exact(0, 10000);
      const a11 = (Ex[0] - O[0]) / 1e4, a21 = (Ex[1] - O[1]) / 1e4;
      const a12 = (Ez[0] - O[0]) / 1e4, a22 = (Ez[1] - O[1]) / 1e4;
      PROJ = { O, a11, a12, a21, a22, det: a11 * a22 - a12 * a21 };

      const [ea, na] = utmOf(-17000, 17000);
      const [ee, ne] = exact(-17000, 17000);
      return Math.hypot(ea - ee, na - ne);
    }

    function utmOf(x, z) {
      const P = PROJ;
      return [P.O[0] + P.a11 * x + P.a12 * z, P.O[1] + P.a21 * x + P.a22 * z];
    }

    function localOf(e, n) {
      const P = PROJ;
      const du = e - P.O[0], dn = n - P.O[1];
      return [(P.a22 * du - P.a12 * dn) / P.det, (-P.a21 * du + P.a11 * dn) / P.det];
    }

    // ---------- Terreno MDT05 por teselas ----------
    let mdt = null;        // Map "nivel_x0_y0" -> tesela con su array de alturas
    let mdtIndex = null;   // contenido de data/mdt/index.json
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x6b8f5a, side: THREE.DoubleSide });

    async function loadMDT(index) {
      const tiles = new Map();
      await Promise.all(index.tiles.map(async t => {
        const res = await fetch(DATA_DIR + "mdt/" + t.file);
        if (!res.ok) throw new Error(`${res.status} al leer ${t.file}`);
        const h = new Float32Array(await res.arrayBuffer());
        tiles.set(`${t.level}_${t.x0}_${t.y0}`, { ...t, h });
      }));
      return tiles;
    }

    // Altura dentro de una tesela: mismo reparto en triángulos que la malla
    function sampleTile(t, e, n) {
      const fx = (e - t.x0) / t.step_m;
      const fz = (t.y0 + t.tile_m - n) / t.step_m;  // fila 0 = norte
      const nx = t.nx, H = t.h;
      const i = Math.min(nx - 2, Math.max(0, Math.floor(fx)));
      const j = Math.min(t.ny - 2, Math.max(0, Math.floor(fz)));
      const tx = fx - i, tz = fz - j;
      const ha = H[j * nx + i], hb = H[j * nx + i + 1];
      const hc = H[(j + 1) * nx + i], hd = H[(j + 1) * nx + i + 1];
      if (tx + tz <= 1) return ha + tx * (hb - ha) + tz * (hc - ha);
      return hd + (1 - tx) * (hc - hd) + (1 - tz) * (hb - hd);
    }

    // Altura del terreno en (x, z): detalle 5 m si existe, si no base 25 m
    function terrainAt(x, z) {
      if (!mdt) return 0;
      const [e, n] = utmOf(x, z);
      const dT = mdtIndex.levels.detail.tile_m, bT = mdtIndex.levels.base.tile_m;
      const d = mdt.get(`detail_${Math.floor(e / dT) * dT}_${Math.floor(n / dT) * dT}`);
      if (d) return sampleTile(d, e, n);
      const b = mdt.get(`base_${Math.floor(e / bT) * bT}_${Math.floor(n / bT) * bT}`);
      if (b) return sampleTile(b, e, n);
      return 0;
    }

    // Malla de una tesela con faldones. `skip(e, n)` omite celdas (se usa en la base
    // dentro de las zonas de detalle, para no solapar superficies).
    function buildTileMesh(t, skip) {
      const { nx, ny, x0, y0, tile_m, h } = t;
      const step = t.step_m;
      const top = y0 + tile_m;
      const pos = [];
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          const [x, z] = localOf(x0 + i * step, top - j * step);
          pos.push(x, h[j * nx + i], z);
        }
      }
      const idx = [];
      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          if (skip && skip(x0 + (i + 0.5) * step, top - (j + 0.5) * step)) continue;
          const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      // Faldones en los cuatro bordes, en orden de recorrido
      const border = [];
      for (let i = 0; i < nx; i++) border.push(i);
      for (let j = 1; j < ny; j++) border.push(j * nx + nx - 1);
      for (let i = nx - 2; i >= 0; i--) border.push((ny - 1) * nx + i);
      for (let j = ny - 2; j >= 1; j--) border.push(j * nx);
      const bottom = border.map(v => {
        const k = pos.length / 3;
        pos.push(pos[v * 3], pos[v * 3 + 1] - SKIRT_M, pos[v * 3 + 2]);
        return k;
      });
      for (let q = 0; q < border.length; q++) {
        const p = border[q], p2 = border[(q + 1) % border.length];
        const bp = bottom[q], bp2 = bottom[(q + 1) % border.length];
        idx.push(p, p2, bp2, p, bp2, bp);
      }

      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return new THREE.Mesh(g, groundMat);
    }

    let vertexCount = 0;

    function buildMDTMeshes() {
      const dT = mdtIndex.levels.detail.tile_m;
      const detailSet = new Set();
      for (const t of mdt.values()) if (t.level === "detail") detailSet.add(`${t.x0}_${t.y0}`);
      const hasDetailAt = (e, n) =>
        detailSet.has(`${Math.floor(e / dT) * dT}_${Math.floor(n / dT) * dT}`);
      for (const t of mdt.values()) {
        const mesh = buildTileMesh(t, t.level === "base" ? hasDetailAt : null);
        vertexCount += mesh.geometry.attributes.position.count;
        scene.add(mesh);
      }
    }

    // Sin terreno (tramo de prueba o fallo de carga): suelo plano
    function buildFlatGround() {
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.05;
      scene.add(ground);
    }

    // ---------- Trazado: densificado y Catmull-Rom ----------
    function densify(pts, step = 10) {
      const out = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
        for (let k = 1; k <= n; k++) {
          const t = k / n;
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
        }
      }
      return out;
    }

    // Catmull-Rom uniforme: pasa por los puntos originales y no corta las esquinas.
    // Los extremos se conservan, así que las uniones entre tramos coinciden.
    function catmullRom(pts, samples = CATMULL_SAMPLES) {
      if (pts.length < 3) return pts;
      const n = pts.length;
      const out = [];
      for (let i = 0; i < n - 1; i++) {
        const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i];
        const p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n - 1)];
        for (let s = 0; s < samples; s++) {
          const t = s / samples, t2 = t * t, t3 = t2 * t;
          const coord = k => 0.5 * (
            2 * p1[k] +
            (-p0[k] + p2[k]) * t +
            (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 +
            (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3
          );
          out.push([coord(0), coord(1)]);
        }
      }
      out.push(pts[n - 1]);
      return out;
    }

    function normalAt(pts, i) {
      const a = pts[Math.max(i - 1, 0)];
      const b = pts[Math.min(i + 1, pts.length - 1)];
      const dx = b[0] - a[0], dz = b[1] - a[1];
      const len = Math.hypot(dx, dz) || 1;
      return [-dz / len, dx / len];
    }

    // Polilíneas [x, z, y]: y es la altura
    function addRibbon(out, pts, off0, off1, lift) {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const na = normalAt(pts, i), nb = normalAt(pts, i + 1);
        const vert = (p, n, off) => [p[0] + n[0] * off, p[2] + lift, p[1] + n[1] * off];
        const a0 = vert(a, na, off0), a1 = vert(a, na, off1);
        const b0 = vert(b, nb, off0), b1 = vert(b, nb, off1);
        out.push(...a0, ...a1, ...b1, ...a0, ...b1, ...b0);
      }
    }

    function resample(pts, step = 0.5) {
      const out = [pts[0]];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
        for (let k = 1; k <= n; k++) {
          const t = k / n;
          out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
        }
      }
      return out;
    }

    function dashed(pts, dash, gap) {
      const r = resample(pts);
      const period = dash + gap;
      const runs = [];
      let run = null, dist = 0;
      for (let i = 0; i < r.length; i++) {
        if (i > 0) dist += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
        const on = (dist % period) < dash;
        if (on) {
          if (!run) { run = []; if (i > 0) run.push(r[i - 1]); }
          run.push(r[i]);
        } else if (run) {
          runs.push(run);
          run = null;
        }
      }
      if (run) runs.push(run);
      return runs;
    }

    // ---------- Alturas de la calzada ----------
    function isBridge(road) {
      return road.bridge && road.bridge !== "no";
    }

    function smoothstep(t) {
      const x = Math.min(1, Math.max(0, t));
      return x * x * (3 - 2 * x);
    }

    // Media ponderada con los vecinos; los extremos no se tocan
    function smoothHeights(h) {
      const out = h.slice();
      for (let i = 1; i < h.length - 1; i++) {
        out[i] = 0.25 * h[i - 1] + 0.5 * h[i] + 0.25 * h[i + 1];
      }
      return out;
    }

    // Calzada normal: pegada al terreno. Puente: sube desde el nivel de las orillas
    // con una rampa de longitud desnivel / MAX_GRADE en cada extremo.
    function roadHeights(road) {
      const pts = road.points;
      const cum = [0];
      for (let i = 1; i < pts.length; i++) {
        cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      }
      const L = cum[cum.length - 1] || 1;
      const ground = pts.map(p => terrainAt(p[0], p[1]) + ROAD_LIFT);
      if (!isBridge(road)) return ground;

      const layer = Math.max(1, Number(road.layer) || 1);
      const bankLevel = Math.max(ground[0], ground[ground.length - 1]);
      const deck = bankLevel + BRIDGE_CLEARANCE_M * layer;
      const rampStart = Math.max(1, (deck - ground[0]) / MAX_GRADE);
      const rampEnd = Math.max(1, (deck - ground[ground.length - 1]) / MAX_GRADE);
      return cum.map((d, i) => {
        const t = Math.min(smoothstep(d / rampStart), smoothstep((L - d) / rampEnd));
        return ground[i] + (deck - ground[i]) * t;
      });
    }

    // ---------- Marcas viales (reglas aproximadas; OSM no las tiene fiables) ----------
    function addMarkings(road, buckets) {
      const pts = road.p3;
      const half = (road.lanes * LANE_W) / 2;
      addRibbon(buckets.white, pts, -half, -half + LINE_W, 0.03);
      addRibbon(buckets.white, pts, half - LINE_W, half, 0.03);
      for (let k = 1; k < road.lanes; k++) {
        const off = -half + k * LANE_W;
        const isCenter = !road.oneway && road.lanes % 2 === 0 && k === road.lanes / 2;
        const runs = isCenter ? [pts] : dashed(pts, DASH, GAP);
        for (const run of runs) {
          addRibbon(buckets.white, run, off - LINE_W / 2, off + LINE_W / 2, 0.03);
        }
      }
    }

    // ---------- Barreras de hormigón ----------
    // TODO: las barreras se colocan sobre el terreno, no sobre el tablero de los puentes.
    const concreteGeo = new THREE.BoxGeometry(0.6, 0.8, 1);
    const concreteMat = new THREE.MeshLambertMaterial({ color: 0xbdbdb8 });

    function addBarrier(b) {
      for (let i = 0; i < b.points.length - 1; i++) {
        const [ax, az] = b.points[i], [bx, bz] = b.points[i + 1];
        const len = Math.hypot(bx - ax, bz - az);
        if (len < 0.1) continue;
        const mx = (ax + bx) / 2, mz = (az + bz) / 2;
        const m = new THREE.Mesh(concreteGeo, concreteMat);
        m.scale.z = len;
        m.position.set(mx, terrainAt(mx, mz) + 0.4, mz);
        m.rotation.y = Math.atan2(bx - ax, bz - az);
        scene.add(m);
      }
    }

    // ---------- Índice de alturas para el coche ----------
    const CELL = 50;
    const roadIndex = new Map();
    function indexRoadPoints(p3) {
      for (const [x, z, y] of p3) {
        const key = `${Math.floor(x / CELL)},${Math.floor(z / CELL)}`;
        if (!roadIndex.has(key)) roadIndex.set(key, []);
        roadIndex.get(key).push([x, z, y]);
      }
    }

    // Altura de calzada más cercana al coche. Con un puente encima, elige la más
    // próxima a la altura actual para no saltar de un nivel a otro.
    function roadHeightNear(x, z, yRef) {
      const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
      let best = null, bestDy = Infinity;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          const list = roadIndex.get(`${cx + dx},${cz + dz}`);
          if (!list) continue;
          for (const [px, pz, py] of list) {
            if (Math.hypot(px - x, pz - z) > SNAP_M) continue;
            const dy = Math.abs(py - yRef);
            if (dy < bestDy) { bestDy = dy; best = py; }
          }
        }
      }
      return best;
    }

    // ---------- Construcción ----------
    const mats = {
      asphalt: new THREE.MeshLambertMaterial({ color: 0x3a3a3a, side: THREE.DoubleSide }),
      white: new THREE.MeshBasicMaterial({ color: 0xf2f2f2, side: THREE.DoubleSide }),
      water: new THREE.MeshBasicMaterial({ color: 0x2f7fc1, side: THREE.DoubleSide }),
    };

    function build(data) {
      const buckets = { asphalt: [], white: [], water: [] };

      for (const road of data.roads) {
        road.points = catmullRom(densify(road.points, 10));
        const h = smoothHeights(roadHeights(road));
        road.p3 = road.points.map((p, i) => [p[0], p[1], h[i]]);
        const half = (road.lanes * LANE_W) / 2;
        addRibbon(buckets.asphalt, road.p3, -half, half, 0);
        addMarkings(road, buckets);
        indexRoadPoints(resample(road.p3, 2));
      }

      for (const w of data.water ?? []) {
        const p3 = w.points.map(p => [p[0], p[1], terrainAt(p[0], p[1]) + WATER_LIFT]);
        addRibbon(buckets.water, p3, -WATER_W / 2, WATER_W / 2, 0);
      }

      for (const [name, arr] of Object.entries(buckets)) {
        if (!arr.length) continue;
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
        g.computeVertexNormals();
        scene.add(new THREE.Mesh(g, mats[name]));
      }

      for (const b of data.barriers ?? []) addBarrier(b);
    }

    // ---------- Coche ----------
    const car = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.7, 4.2),
      new THREE.MeshLambertMaterial({ color: 0xc62828 })
    );
    body.position.y = 0.6;
    car.add(body);
    scene.add(car);

    const keys = {};
    let mmVisible = true, mmRotate = false, mmRange = 1200;

    addEventListener("keydown", e => {
      keys[e.code] = true;
      if (e.code === "KeyM") mmVisible = !mmVisible;
      if (e.code === "KeyN") mmRotate = !mmRotate;
      if (e.code === "Equal" || e.code === "NumpadAdd") mmRange = Math.min(5000, mmRange * 1.25);
      if (e.code === "Minus" || e.code === "NumpadSubtract") mmRange = Math.max(150, mmRange / 1.25);
    });
    addEventListener("keyup", e => keys[e.code] = false);

    let speed = 0, heading = 0;
    const ACCEL = 10, BRAKE = 12;

    function update(dt) {
      const gas = keys.KeyW || keys.ArrowUp;
      const brake = keys.KeyS || keys.ArrowDown;
      const left = keys.KeyA || keys.ArrowLeft;
      const right = keys.KeyD || keys.ArrowRight;

      if (gas) speed += ACCEL * Math.max(0.05, 1 - speed / MAX_SPEED) * dt;
      if (brake) speed -= (speed > 0 ? BRAKE : ACCEL / 2) * dt;
      if (!gas && !brake && speed !== 0) {
        const coast = (0.3 + 0.005 * Math.abs(speed)) * dt;
        speed -= Math.sign(speed) * Math.min(Math.abs(speed), coast);
      }
      speed = Math.max(-8, Math.min(MAX_SPEED, speed));

      const steer = (left ? 1 : 0) - (right ? 1 : 0);
      const turnRate = 0.9 * Math.min(1, Math.abs(speed) / 10) / (1 + Math.abs(speed) / 50);
      heading += steer * turnRate * Math.sign(speed) * dt;

      car.position.x += Math.sin(heading) * speed * dt;
      car.position.z += Math.cos(heading) * speed * dt;

      const ry = roadHeightNear(car.position.x, car.position.z, car.position.y);
      car.position.y = ry ?? terrainAt(car.position.x, car.position.z);
      car.rotation.y = heading;

      const back = new THREE.Vector3(-Math.sin(heading), 0, -Math.cos(heading));
      const desired = car.position.clone().addScaledVector(back, 9).add(new THREE.Vector3(0, 3.5, 0));
      camera.position.lerp(desired, Math.min(1, dt * 6));
      camera.lookAt(car.position.x, car.position.y + 1.2, car.position.z);

      speedEl.textContent = `${Math.round(Math.abs(speed) * 3.6)} km/h (máx. ${VMAX_KMH}) · x ${car.position.x.toFixed(0)} z ${car.position.z.toFixed(0)} y ${car.position.y.toFixed(1)}`;
    }

    // ---------- Minimapa ----------
    const mm = document.getElementById("minimap");
    const mctx = mm.getContext("2d");
    const MM_PX = 280, DPR = devicePixelRatio;
    mm.width = MM_PX * DPR;
    mm.height = MM_PX * DPR;
    mm.style[MM_SIDE] = "10px";

    const ortho = new Image();
    let orthoOK = false;
    ortho.onload = () => { orthoOK = true; };
    ortho.src = ORTHO_FILE;

    let mapRoads = [], mapWater = [], mapBarriers = [], bounds = null;

    function strokePath(pts) {
      mctx.beginPath();
      pts.forEach(([x, z], i) => (i ? mctx.lineTo(x, z) : mctx.moveTo(x, z)));
      mctx.stroke();
    }

    function drawMinimap() {
      if (!mmVisible) { mm.style.display = "none"; return; }
      mm.style.display = "block";

      const c = MM_PX / 2;
      const k = MM_PX / mmRange;
      const px = w => w / k;
      const h = car.rotation.y;

      mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      mctx.clearRect(0, 0, MM_PX, MM_PX);
      mctx.fillStyle = "#1d2a1d";
      mctx.fillRect(0, 0, MM_PX, MM_PX);

      mctx.save();
      mctx.translate(c, c);
      if (mmRotate) mctx.rotate(h + Math.PI);
      mctx.scale(k, k);
      mctx.translate(-car.position.x, -car.position.z);
      mctx.lineCap = "round";
      mctx.lineJoin = "round";

      if (orthoOK && bounds) {
        mctx.drawImage(ortho, bounds[0], bounds[1], bounds[2] - bounds[0], bounds[3] - bounds[1]);
      }
      const alpha = orthoOK ? 0.6 : 1;

      mctx.strokeStyle = "rgba(40,120,210,0.85)";
      mctx.lineWidth = 25;
      for (const w of mapWater) strokePath(w.points);

      for (const r of mapRoads) {
        mctx.strokeStyle = `rgba(70,70,70,${alpha})`;
        mctx.lineWidth = r.lanes * LANE_W;
        strokePath(r.points);
      }
      mctx.strokeStyle = "rgba(255,60,60,0.9)";
      mctx.lineWidth = px(1.5);
      for (const r of mapRoads) strokePath(r.points);

      mctx.strokeStyle = "#e8e8e0";
      mctx.lineWidth = px(3);
      for (const b of mapBarriers) strokePath(b.points);

      mctx.restore();

      mctx.save();
      mctx.translate(c, c);
      mctx.rotate(mmRotate ? 0 : Math.PI - h);
      mctx.fillStyle = "#ffdd00";
      mctx.strokeStyle = "#000";
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.moveTo(0, -9); mctx.lineTo(6, 7); mctx.lineTo(0, 3); mctx.lineTo(-6, 7);
      mctx.closePath();
      mctx.fill();
      mctx.stroke();
      mctx.restore();

      if (!mmRotate) {
        mctx.fillStyle = "#fff";
        mctx.font = "bold 12px system-ui";
        mctx.fillText("N", c - 4, 14);
      }
    }

    // ---------- Arranque ----------
    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} al leer ${url}`);
      return res.json();
    }

    async function init() {
      try {
        const data = await fetchJSON(DATA_FILE);

        let projErr = 0;
        if (data.origin) projErr = setupProjection(data.origin);

        // Terreno MDT05 por teselas. Sin él (o con el tramo de prueba), suelo plano.
        if (!SAMPLE && USE_MDT) {
          try {
            mdtIndex = await fetchJSON(MDT_INDEX);
            mdt = await loadMDT(mdtIndex);
          } catch {
            mdt = null;
          }
        }
        const t0 = performance.now();
        if (mdt) buildMDTMeshes(); else buildFlatGround();

        build(data);
        mapRoads = data.roads;
        mapWater = data.water ?? [];
        mapBarriers = data.barriers ?? [];
        bounds = data.bounds ?? null;

        if (data.roads.length) {
          const pts = data.roads[0].points;
          const p0 = pts[0], p1 = pts[1] ?? pts[0];
          car.position.set(p0[0], terrainAt(p0[0], p0[1]), p0[1]);
          heading = Math.atan2(p1[0] - p0[0], p1[1] - p0[1]);
        }

        const terrainMsg = mdt
          ? `MDT05: ${mdtIndex.tiles.length} teselas, ${vertexCount} vértices, malla ${(performance.now() - t0).toFixed(0)} ms, error de proyección ~${projErr.toFixed(1)} m`
          : "terreno plano";
        statusEl.textContent =
          `Cargado: ${data.roads.length} tramos, ${mapBarriers.length} barreras, ${mapWater.length} cursos de agua, ${terrainMsg}`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}. Sirve la carpeta del proyecto con un servidor local (ver README).`;
      }
      requestAnimationFrame(loop);
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      renderer.render(scene, camera);
      drawMinimap();
      requestAnimationFrame(loop);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    init();
  </script>
</body>
</html>
